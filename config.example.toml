# 复制到 ~/.agent-accounts/config.toml 后修改，并执行 chmod 600 ~/.agent-accounts/config.toml
# 所有字段都可以省略，省略时用默认值。

[browser]
channel = "chrome"   # 本机 Google Chrome；留空用 Playwright 自带的 Chromium
headless = false     # 抖音在 headless 下会触发验证码（Spike-4），不要打开

[douyin]
auto_reply = "dry_run"   # on / off / dry_run

# ① 媒体理解：Anthropic Messages 格式（/v1/messages），模型必须支持图片输入
[llm.understand]
base_url = "https://api.anthropic.com"   # 自定义 endpoint；兼容 Anthropic Messages 的代理也可以
api_key = "sk-ant-..."                   # 或者删掉这行，改用 api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
max_tokens = 8000
structured_output = true                 # 代理不支持 output_config 时改成 false

# ③ 回复生成（M3 才用）：Anthropic Messages 格式
[llm.reply]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"

# ② 语音转写：OpenAI 兼容的 /v1/audio/transcriptions
[transcribe]
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "whisper-1"
language = "zh"

# 告警 webhook（可选）：验证码 / 风控冻结 / 登录失效 / 发送失败时 POST 一份 JSON
# {platform, level, message, run_id, time, text}；URL 常带 token，按密钥对待
# 配好后用 agent-accounts alert-test 发一条测试告警
[alerts]
# webhook_url = "https://example.com/hook/..."   # 或改用 webhook_url_env = "AGENT_ALERT_WEBHOOK"
min_level = "warning"    # info / warning / critical

[media]
max_frames = 10      # 视频最多抽几帧发给模型
frame_width = 768    # 抽帧缩放宽度
max_images = 12      # 图集最多用几张

# 自动回复护栏（douyin.auto_reply 为 on 时才会真的发送）
[guard]
only_mutual = true       # 只回互相关注的私聊；陌生人、群聊一律不回
allowlist = []           # 非空时只回这些会话（conv_id 或昵称）
blocklist = []
min_confidence = 0.6     # 模型把握低于这个值就不发
max_len = 120            # 单条消息最大字数
max_messages = 3         # 一次回复最多分几条发
min_interval_s = 60      # 同一会话两次发送的最小间隔（秒）
max_per_hour = 20
max_per_day = 100
extra_block_words = []   # 额外的禁用词

# HTTP MCP（agent-accounts mcp --http）。stdio 模式（agent-accounts mcp）不用这一段
[mcp]
host = "127.0.0.1"       # 只本机访问；给其他机器用时改成 0.0.0.0（明文 HTTP，只在可信内网或加密通道里用）
port = 8765
path = "/mcp"
# token 用 agent-accounts mcp-token 生成并自动写到这里（Windows：scripts\new-mcp-token.ps1）
# 也可以改用环境变量：token_env = "AGENT_ACCOUNTS_MCP_TOKEN"
