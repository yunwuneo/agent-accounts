# 复制到 ~/.agent-accounts/config.toml 后修改，并执行 chmod 600 ~/.agent-accounts/config.toml
# 所有字段都可以省略，省略时用默认值。

[browser]
channel = "chrome"   # 本机 Google Chrome；留空用 Playwright 自带的 Chromium
headless = false     # 抖音在 headless 下会触发验证码（Spike-4），不要打开

[douyin]
auto_reply = "dry_run"   # on / off / dry_run
interval_min_s = 60      # douyin run / sync --watch 两轮之间随机等多少秒（最短）
interval_max_s = 120     # （最长）
quiet_hours = []         # 休息时段，本机时间，如 ["03:00-08:00", "11:00-12:00"]；可跨午夜 "23:00-07:00"
quiet_wake_jitter_s = 300  # 休息结束后再随机晚 0–N 秒醒来，避免每天整点上线

# 可选安卓辅助后端：仅 douyin android 命令使用，不改变网页端 run/sync。
# 准备方法与操作限制见 docs/android.md；不自动安装驱动、解锁或登录。
[douyin.android]
enabled = false
udid = ""               # adb devices 中明确授权的专用手机序列号
adb = "adb"             # 也可使用 platform-tools/adb.exe 的绝对路径（TOML 单引号）
appium_url = "http://127.0.0.1:4725"
allow_send = false      # 人工单条发送另需 --send --confirm-current-thread
auto_reply = "dry_run"  # android run 独立开关；真发送还需 --generate --allow-send
tested_version = "40.4.0"  # 已验收 UI 版本；升级后应重验，不能仅改数字跳过
request_timeout_s = 60
monitor_interval_s = 7200 # 补漏间隔（秒），默认2小时，1秒–7天；修改后重新启动
monitor_trigger = "notification" # 通知触发 + 定时补漏；poll 为仅定时检查
thread_name = ""          # 人工确认的唯一互关私聊精确昵称
self_name = ""            # 当前专用账号精确昵称；昵称不是服务端稳定身份

# 小红书：只处理已关注的会话；真正发送同样要 auto_reply = "on" 加 xiaohongshu run --allow-send
[xiaohongshu]
auto_reply = "dry_run"   # on / off / dry_run
max_open = 5             # 每轮最多点开几个有新消息的会话（点开会被平台标已读）
digest_per_tick = 3      # 每轮最多分析几篇新分享的笔记；没分析完的会话留到下一轮再回
interval_min_s = 60
interval_max_s = 120
quiet_hours = []
quiet_wake_jitter_s = 300

# ① 媒体理解：Anthropic Messages 格式（/v1/messages），模型必须支持图片输入
[llm.understand]
base_url = "https://api.anthropic.com"   # 自定义 endpoint；兼容 Anthropic Messages 的代理也可以
api_key = "sk-ant-..."                   # 或者删掉这行，改用 api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
max_tokens = 8000
structured_output = true                 # 代理不支持 output_config 时改成 false

# ③ 回复生成（M3 才用）：Anthropic Messages 格式
[llm.reply]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"

# ② 语音转写：OpenAI 兼容的 /v1/audio/transcriptions
[transcribe]
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "whisper-1"
language = "zh"

# 告警 webhook（可选）：验证码 / 风控冻结 / 登录失效 / 发送失败时 POST 一份 JSON
# {platform, level, message, run_id, time, text}；URL 常带 token，按密钥对待
# 配好后用 agent-accounts alert-test 发一条测试告警
[alerts]
# webhook_url = "https://example.com/hook/..."   # 或改用 webhook_url_env = "AGENT_ALERT_WEBHOOK"
min_level = "warning"    # info / warning / critical

[media]
frame_interval_s = 5          # 约每几秒抽一帧；帧均匀覆盖整段视频，不只看开头
max_frames = 30               # 视频最多抽几帧发给模型（超过时帧间隔变大，仍覆盖到结尾）
frame_width = 768             # 抽帧缩放宽度
max_images = 12               # 图集最多用几张
max_video_seconds = 3600      # 语音最多转写多长
transcribe_segment_s = 600    # 长音轨分段转写，每段秒数

# 自动回复护栏（douyin.auto_reply 为 on 时才会真的发送）
[guard]
only_mutual = true       # 只回互相关注的私聊；陌生人、群聊一律不回
allowlist = []           # 非空时只回这些会话（conv_id 或昵称）
blocklist = []
min_confidence = 0.6     # 模型把握低于这个值就不发
max_len = 120            # 单条消息最大字数
max_messages = 3         # 一次回复最多分几条发
min_interval_s = 60      # 同一会话两次发送的最小间隔（秒）
max_per_hour = 20
max_per_day = 100
extra_block_words = []   # 额外的禁用词

# 回复模型的工具调用：打开后回复模型可以先查更早的消息、搜索、看分享的完整分析、看对方关系，
# 再给出决定。默认只查本地库；paid 单独开启图片理解。decide 不开浏览器，图片仅能读缓存。
[reply_tools]
enabled = false
max_rounds = 4           # 每次决策最多调用几轮工具
paid = []               # 可选 "view_image"（小红书图片）、"analyze_share"（两平台分享补分析）
max_paid_calls = 2       # 每次决策两种付费工具共用的处理次数，同时消耗本轮 digest_per_tick

# HTTP MCP（agent-accounts mcp --http）。stdio 模式（agent-accounts mcp）不用这一段
[mcp]
host = "127.0.0.1"       # 只本机访问；给其他机器用时改成 0.0.0.0（明文 HTTP，只在可信内网或加密通道里用）
port = 8765
path = "/mcp"
# 经反向代理 / 内网穿透（nginx、frp 等）访问时，把对外域名写进来，否则会 421 Invalid Host header
# allowed_hosts = ["mcp.example.com"]
# token 用 agent-accounts mcp-token 生成并自动写到这里（Windows：scripts\new-mcp-token.ps1）
# 也可以改用环境变量：token_env = "AGENT_ACCOUNTS_MCP_TOKEN"
